# Public demo on Render's free plan: "Try the live demo" workspaces only. Guide: docs/deployment-render-demo.md.
# No secrets and no real mail (EMAIL_MODE=file): the demo needs no Supabase or Resend keys, and the app
# refuses to start in demo mode if it finds them. The free database is deleted by Render after 30 days;
# recreate it, since demo workspaces are throwaway. Never point this at a real database or add provider keys.
databases:
  - name: invoice-tracker-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"

services:
  - type: web
    name: invoice-tracker-demo
    runtime: node
    region: singapore
    plan: free
    # DEMO_MODE below is read at BUILD time too (next.config.ts sets the Referrer-Policy header from it),
    # so it must be in the build environment. Render env vars apply to both build and start.
    buildCommand: npm ci --include=dev && npm run build
    # The free plan has no pre-deploy step, so migrations run at start.
    startCommand: npm run db:migrate && npm run start:demo
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-tracker-demo-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_MAX_ACTIVE
        value: "10"
      - key: EMAIL_MODE
        value: file
      - key: EMAIL_FROM
        value: Invoice Tracker Demo <noreply@example.com>
      # Change if Render gives the service a different .onrender.com name. Must be https.
      - key: APP_URL
        value: https://invoice-tracker-demo.onrender.com
      # Render's edge appends the real client address to X-Forwarded-For; rate limits rely on it.
      - key: TRUST_PROXY
        value: "true"
