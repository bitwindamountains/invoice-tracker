name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice_ci_only
          POSTGRES_DB: invoice_tracker
        ports: ["54329:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://invoice:invoice_ci_only@127.0.0.1:54329/invoice_tracker
      APP_URL: http://localhost:3000
      EMAIL_MODE: file
      # Tests create confirmed Supabase Auth users directly and delete them afterwards.
      REQUIRE_EMAIL_VERIFICATION: "false"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start local test server
        run: |
          npm run dev > /tmp/invoice-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:performance
        env:
          PERF_P95_MS: 2000
      - run: npm run build
      # Shipped dependencies must be free of high advisories. Dev tooling is held to critical only:
      # eslint-config-next pulls braces <=3.0.3, which has no patched release yet.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies for critical advisories
        run: npm audit --audit-level=critical
